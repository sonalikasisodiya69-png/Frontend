<!DOCTYPE html>
<html>
<head>
    <title>Form +Table Project</title>
</head>
<body>

<h2>Student Form</h2>

<form id="myForm"
    onsubmit="handlesubmit(event)">
    Name: <input type="text" id="name" required><br><br>
    Mobile: <input type="text" id="mobile" required><br><br>
    Password: <input type="password" id="password" required><br><br>

    Gender:
    <input type="radio" name="gender" value="Male"> Male
    <input type="radio" name="gender" value="Female"> Female
    <br><br>

    <button type="submit">Submit</button>
</form>

<h2>Data Table</h2>

<table border="1">
    <thead>
        <tr>
            <th>Name</th>
            <th>Mobile</th>
            <th>Gender</th>
        </tr>
    </thead>
    <tbody id="tableBody"></tbody>
</table>

<script>
    let dataArray= [];
     function handlesubmit(e){
    e.preventDefault();

    let name = document.getElementById("name").value;
    let mobile = document.getElementById("mobile").value;
    let gender = 
    document.querySelector('input[name="gender"]:checked').value;
    let user = { name,mobile,gender};
    dataArray.push(user);
    displayData();
    document.getElementById("myForm").reset();
       
    function displayData(){
        let table =
        document.getElementById("tableBody");
        table.innerHTML="";
        dataArray.forEach((item) => {
            let row = `
            <tr>
                <td>${item.name}</td>
                <td>${item.mobile}</td>
                <td>${item.gender}</td>
                </tr>
                `;
 table.innerHTML += row;

        });    
    };
}
</script>

</body>
</html>
