<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Tracker System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>git 
      <h1>Budget Tracker System</h1>
    <div class="container">
        <div class="left">
            <div class="card">
                <h2>Add Budget</h2>
                <label>Budget:</label>
                <input type="number"
            id="budget-Input" placeholder="Enter Total Budget">

            <button onclick="addBudget()">Add Budget</button>      
            </div >
            

            <div class="card">
                <h2>Add Expense</h2>
                <label>Expense Title:</label>
                 <select id="Category">
                         <option value="">Select Category</option>
                         <option value="Grocery">Grocery</option>
                         <option value="Health">Health</option>
                         <option value="Cosmetics">Cosmetics</option>
                         <option value="Fuel">Fuel</option>   
                         <option value="Shopping">Shopping</option> 
                         <option value="Food">Food</option> 
                         <option value="Bills">Bills</option>   
                         </select>    
                         
                <label>Amount:</label>
                <input type="number" id="expense-Amount" placeholder="Expense Amount">     
                <button onclick="addExpense()">Add Expense</button>
                </div>
                <button id="reset-btn" class="btn-red m-top" onclick="resetAll()">Reset All</button>
            </div>

            <div class="right">
                <div class="summary">
                    <div class="box">
                       <h4>Total Budget:</h4>
                       <p id="total-budget">0.00</p>
                    </div>
                    <div class="box">
                        <h4>Total Expenses:</h4>
                        <p id="total-expenses">0.00</p>
                    </div>
                    <div class="box">
                        <h4>Budget Left:</h4>
                        <p id="budget-left">0.00</p>
                    </div>
                
                </div>
                
                    <h3>Expense History:</h3>
                    <table>
                        <thead>
                            <tr>
                                <th>Expense Name</th>
                                <th>Amount</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="expenseTable"></tbody>
                        </table>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
