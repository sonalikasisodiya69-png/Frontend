<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet"
    href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<body>
    <div class="Calculator">
        <input type="text" id="display" class="display" disabled>
        <div class="buttons">
            <button class="button clear" onclick="clearDisplay()">C</button>
            <button class="button operator"
            onclick="apendOperation('/')">/</button>
            <button class="button operator"
            onclick="apendOperation ('*')">*</button>
            <button class="button operator"
            onclick="apendOperation('-')">-</button>
            <button class="button" 
            onclick="apendNumber('7')">7</button>
            <button class="button"
            onclick="apendNumber('8')">8</button>
            <button class="button"
            onclick="apendNumber('9')">9</button>
            <button class="button operator"
            onclick="apendOperation('+')">+</button>
            <button class="button"
            onclick="apendNumber('4')">4</button>
            <button class="button"
            onclick="apendNumber('5')">5</button>
            <button class="button"
            onclick="apendNumber('6')">6</button>
            <button class="button equal"
            onclick="calculate()">=</button>
            <button class="button"
            onclick="apendNumber('1')">1</button>
            <button class="button"
            onclick="apendNumber('2')">2</button>
            <button class="button"
            onclick="apendNumber('3')">3</button>
            <button class="button"
            onclick="apendNumber('0')">0</button>
        </div>        
    </div>
    <script src="script.js"></script>
</body>
</html>
