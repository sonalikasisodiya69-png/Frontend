<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet"
    href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
</head>
<body>
   <div class="container">
    <div class="calculator">
        <input type="text" id="inputBox" placeholder="0"  readonly>
        <div>
         <button class=" button operator" onclick="clearDisplay()">AC</button>  
         <button class=" button operator" onclick="deleteLast()">DEL</button>  
         <button class=" button operator"  onclick="press('%')">%</button>  
         <button class=" button operator"  onclick="press('/')">/</button>  
         </div>
         <div>
            <button class="button" onclick="press('7')">7</button>  
            <button class="button" onclick="press('8')">8</button>  
            <button class="button" onclick="press('9')">9</button>  
            <button class="button operator"  onclick="press('*')">*</button>  
         </div>
         <div>
            <button class="button" onclick="press('4')">4</button>  
            <button class="button" onclick="press('5')">5</button>  
            <button class="button" onclick="press('6')">6</button>  
            <button class="button operator"  onclick="press('-')">-</button>  
         </div>
         <div>
            <button class="button" onclick="press('1')">1</button>  
            <button class="button" onclick="press('2')">2</button>  
            <button class="button" onclick="press('3')">3</button>  
            <button class="button operator"  onclick="press('+')">+</button>
         </div>
         <div>
            <button class="button" onclick="press('00')">00</button>  
            <button class="button" onclick="press('0')">0</button>  
            <button class="button" onclick="press('.')">.</button>  
            <button class="button equalBtn" onclick="calculate()">=</button>  
         </div> 
    </div>
    <script src="script.js"></script>

    <a href="../Home page/home.html" class="Back-link">
    Back to Home Page
</a>
<a href="../TO-DO List/TO-DO-List.html" class="Next-link">Next Page</a>
 </div>
</body>
</html>
